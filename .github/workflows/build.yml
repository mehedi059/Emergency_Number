name: Build Emergency Number APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files (flat files in repo root -> www folder)
        run: |
          mkdir www
          cp index.html style.css app.js data.js www/

      - name: Install latest Capacitor and create Android project
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/app@latest @capacitor/geolocation@latest
          npx cap init "Emergency Number" com.mehedi.emergencynumber --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add location permission to the Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>|' $M
          grep -n "uses-permission" $M

      - name: Set app icon from icon.png
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            convert icon.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: Emergency-Number-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
